[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streamfetch"
version = "1.6.1"
description = "Local-first media downloader, library and player for YouTube and SoundCloud"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "mxweir" }]
keywords = ["streamfetch", "streamlit", "yt-dlp", "youtube", "soundcloud", "downloader", "media-library", "music-player", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mutagen>=1.47,<2",
  "packaging>=24,<27",
  "Pillow>=11,<13",
  "streamlit>=1.66,<2",
  "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2,<2", "av>=11,<19"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
]
desktop = [
  "pywebview>=5.4,<7",
]
package = [
  "faster-whisper>=1.2,<2",
  "av>=11,<19",
  "pyinstaller>=6.11,<7",
  "pywebview>=5.4,<7",
]

[project.scripts]
streamfetch-desktop = "streamfetch.desktop:main"

[project.urls]
Homepage = "https://github.com/mxweir/streamfetch"
Issues = "https://github.com/mxweir/streamfetch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/streamfetch"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "streamfetch/_desktop_app.py"
"docs/assets/streamfetch-mark.svg" = "streamfetch/assets/streamfetch-mark.svg"

[tool.pytest.ini_options]
addopts = "-q --cov=streamfetch --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
